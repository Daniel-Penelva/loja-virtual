<h2 class="cart-title">Carrinho</h2>
<div class="cart-container" *ngIf="itensCarrinho.length > 0; else carrinhoVazio">
    <ul>
        <li *ngFor="let itemCarrinho of itensCarrinho">
            <img [src]="itemCarrinho.imagem" alt="item produto">
            <p>{{ itemCarrinho.descricao }}</p>
            <p>{{ itemCarrinho.preco | currency: 'BRL' }}</p>
            <label class="text-label">
                Quantidade
                <input type="number" [(ngModel)] = "itemCarrinho.quantidadeCarrinho" min="1" max="{{ itemCarrinho.quantidadeEstoque }}" (change)="calcularTotal()">
            </label>
            <p class="product_avaiability">
              {{ itemCarrinho.quantidadeEstoque}} unidade(s) em estoque            
            </p>
            <button class="remove-button" (click)="removerProdutoCarrinho(itemCarrinho.id)"><i class="fa-solid fa-xmark"></i></button>
        </li>
    </ul>
    <h2 class="cart-total">Total: {{ total | currency: 'BRL' }}</h2>
    <button class="buy-button" (click)="comprar()">Comprar</button>
    <button class="clear-cart-button" (click)="limparCarrinho()">Limpar Carrinho</button>
</div>
<ng-template #carrinhoVazio>
  <div class="empty-cart">
    <i class="fa-solid fa-cart-shopping"></i>
    <p>Seu carrinho está vazio</p>
    <span>Adicione produtos para continuar!</span>
  </div>
</ng-template>
